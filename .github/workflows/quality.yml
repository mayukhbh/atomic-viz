name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:run
      - run: npm run build
        env:
          SITE_URL: https://atomic-viz.vercel.app
      - run: npm run verify:og
        env:
          SITE_URL: https://atomic-viz.vercel.app
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
        env:
          SOFTWARE_WEBGL: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: artifacts/smoke
          if-no-files-found: warn
